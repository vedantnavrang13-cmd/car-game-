<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>NEON APEX - 3D Racing</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#05060d;font:600 14px "Segoe UI",Arial,sans-serif;color:#dff;user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
@keyframes pop{from{transform:scale(1.8);opacity:0}30%{opacity:1}to{transform:scale(1);opacity:0}}
#hud{position:fixed;inset:0;pointer-events:none;display:none;z-index:3;text-shadow:0 0 8px #0ff}
#hud.on{display:block}
.b{position:absolute;padding:8px 16px;background:#050a1cbb;border:1px solid #0ff5;border-radius:4px}
.b b{color:#0ff;font-size:22px}
.bar{height:10px;background:#123;margin-top:6px;border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#0f8,#ff0,#f24)}
.bar i.n{background:linear-gradient(90deg,#0ff,#f0f)}
#cd{position:absolute;left:0;right:0;top:26%;text-align:center;font-size:130px;font-style:italic;font-weight:900;color:#fff;text-shadow:0 0 30px #0ff;opacity:0}
#msg{position:absolute;left:0;right:0;top:58%;text-align:center;font-size:30px;color:#ff0;opacity:0;transition:opacity .3s}
.row{display:flex;gap:30px;min-width:340px;padding:8px 16px;background:linear-gradient(90deg,#0b1230,#0b123000);border-left:3px solid #0ff5;transition:.2s}
.row:hover{border-color:#0ff;background:#0b1230cc}
.row span:nth-child(2){flex:1}.row.me{border-color:#f0f;color:#fff;background:linear-gradient(90deg,#231046,#23104600);box-shadow:0 0 18px #f0f4}
.row span:first-child{color:#0ff;font-style:italic;font-weight:900}

/* ===== NEW MENU UI ===== */
.ov{position:fixed;inset:0;display:none;z-index:9;overflow-y:auto;overflow-x:hidden;color:#eaf6ff;font-family:"Chakra Petch","Segoe UI",Arial,sans-serif;
 background:linear-gradient(90deg,#070512f2 0%,#0a0620d9 40%,#0a062070 72%,#070512b0 100%),linear-gradient(#150b3c 0%,#2b1052 50%,#070512 51%)}
.ov.on{display:flex;animation:fi .45s ease-out}
@keyframes fi{from{opacity:0}}
.sun{position:fixed;right:7%;top:12%;width:min(40vw,440px);aspect-ratio:1;border-radius:50%;background:linear-gradient(#ffd23f 5%,#ff2e88 58%,#7a1fff);
 -webkit-mask-image:linear-gradient(#000 0 55%,transparent 55% 58%,#000 58% 67%,transparent 67% 71%,#000 71% 79%,transparent 79% 84%,#000 84% 90%,transparent 90% 96%,#000 96%);
 mask-image:linear-gradient(#000 0 55%,transparent 55% 58%,#000 58% 67%,transparent 67% 71%,#000 71% 79%,transparent 79% 84%,#000 84% 90%,transparent 90% 96%,#000 96%);
 filter:drop-shadow(0 0 60px #ff2e8899);animation:bob 6s ease-in-out infinite;pointer-events:none}
@keyframes bob{50%{transform:translateY(-14px)}}
.floor{position:fixed;left:-60%;right:-60%;bottom:0;height:46vh;pointer-events:none;background-image:linear-gradient(#21e6ff55 2px,transparent 2px),linear-gradient(90deg,#21e6ff55 2px,transparent 2px);
 background-size:64px 64px;transform:perspective(420px) rotateX(64deg);transform-origin:50% 100%;animation:grid 2s linear infinite;
 -webkit-mask-image:linear-gradient(transparent,#000 60%);mask-image:linear-gradient(transparent,#000 60%)}
@keyframes grid{to{background-position:0 64px}}
.shell{position:relative;z-index:2;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:40px;width:min(1180px,92vw);margin:auto;padding:32px 0;align-items:end}
.kick{font-size:14px;letter-spacing:.3em;color:#ff2e88;margin-bottom:6px}
.brand h1{display:flex;flex-direction:column;font-size:clamp(64px,12vw,140px);line-height:.86;font-style:italic;font-weight:700;letter-spacing:.02em;transform:skewX(-8deg);transform-origin:left bottom}
.brand h1 span:first-child{color:#fff;text-shadow:0 0 30px #21e6ffaa}
.brand h1 span:last-child{background:linear-gradient(90deg,#ff2e88,#ffb020);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px #ff2e8888)}
.sub{margin-top:14px;font-size:17px;opacity:.75}
.nav{display:flex;flex-direction:column;gap:10px;margin-top:28px;width:min(420px,100%)}
.ov button{font:inherit;color:#eaf6ff;cursor:pointer;border:0;border-left:4px solid #ffffff33;text-align:left;background:#ffffff10;padding:13px 22px;display:flex;flex-direction:column;gap:2px;transform:skewX(-10deg);transition:transform .18s,background .18s,color .18s,border-color .18s}
.ov button>*{transform:skewX(10deg);pointer-events:none}
.ov button b{font-size:18px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.ov button em{font-style:normal;font-size:12.5px;opacity:.65}
.ov button:hover,.ov button:focus-visible{background:linear-gradient(90deg,#21e6ff,#8af3ff);color:#04101f;border-left-color:#ff2e88;transform:skewX(-10deg) translateX(14px);outline:none}
.ov button:active{transform:skewX(-10deg) translateX(14px) scale(.98)}
.ov button.hot{background:linear-gradient(90deg,#ff2e88,#ff7a3d);border-left-color:#fff;color:#fff}
.ov button.hot:hover,.ov button.hot:focus-visible{background:linear-gradient(90deg,#ffd23f,#ffb020);color:#2a0a00}
.keys{justify-self:end;display:grid;grid-template-columns:auto 1fr;gap:10px 16px;align-items:center;padding:22px 26px;background:#0b0820b8;border:1px solid #ffffff1f;font-size:14px}
.keys h3{grid-column:1/-1;font-size:15px;letter-spacing:.12em;color:#21e6ff}
.keys kbd{font:700 13px inherit;padding:4px 10px;background:#ffffff18;border-bottom:3px solid #ffffff44;border-radius:5px;justify-self:start;white-space:nowrap}
.panel{position:relative;z-index:2;margin:auto;width:min(540px,92vw);padding:32px 34px;background:#0b0820e8;border:1px solid #21e6ff55;box-shadow:0 0 0 1px #ff2e8833,0 30px 80px #000b;display:flex;flex-direction:column;gap:18px}
.panel h2{font-size:32px;font-style:italic;letter-spacing:.06em;padding-bottom:12px;border-bottom:2px solid #ff2e88}
.field{display:flex;justify-content:space-between;align-items:center;gap:16px;font-weight:600}
.seg{display:flex;gap:4px}
.ov .panel button{transform:none;flex-direction:row;align-items:center;justify-content:center;border-left:0;border-bottom:3px solid #ffffff33;padding:10px 16px}
.ov .panel button>*{transform:none}
.ov .panel button:hover,.ov .panel button:focus-visible{transform:none}
.ov .panel .seg button{min-width:44px;padding:8px 12px;font-weight:700}
.ov .panel .seg button.on{background:#21e6ff;color:#04101f;border-bottom-color:#ff2e88}
.actions{display:flex;gap:10px;margin-top:6px}
.actions button{flex:1}
input[type=range]{accent-color:#ff2e88;width:200px}
.sw{position:relative;width:50px;height:26px}
.sw input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer;z-index:1}
.sw i{position:absolute;inset:0;background:#ffffff26;border-radius:13px;transition:.2s}
.sw i::after{content:'';position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+i{background:#21e6ff}
.sw input:checked+i::after{transform:translateX(24px);background:#04101f}
.sw input:focus-visible+i{outline:2px solid #ff2e88;outline-offset:3px}
#res .panel{text-align:center;align-items:stretch}
#rt{font-size:clamp(46px,9vw,76px);font-style:italic;line-height:1;background:linear-gradient(90deg,#21e6ff,#ff2e88,#ffb020);-webkit-background-clip:text;background-clip:text;color:transparent}
#rs{font-size:16px;opacity:.8;font-weight:600;border:0;padding:0}
.row{display:flex;gap:24px;padding:9px 16px;background:#ffffff0d;border-left:3px solid #21e6ff55;text-align:left}
.row span:nth-child(2){flex:1}
.row span:first-child{color:#21e6ff;font-weight:700;width:22px}
.row.me{border-left-color:#ff2e88;background:#ff2e8830;color:#fff;box-shadow:none}
@media(max-width:760px){.shell{grid-template-columns:1fr;gap:16px}.keys{display:none}.sun{opacity:.5;right:-10%}.field{flex-wrap:wrap}}
@media(prefers-reduced-motion:reduce){.ov,.ov *{animation:none!important;transition:none!important}}

/* ===== fit-to-screen menu (no scrolling) ===== */
.ov{overflow:hidden}
.shell{height:100vh;height:100dvh;padding:3vh 0;margin:0 auto;align-items:center}
.keys{align-self:center}
.brand h1{font-size:clamp(44px,min(11vw,17vh),130px)}
.sub{margin-top:clamp(4px,1.5vh,14px)}
.nav{gap:clamp(4px,1.2vh,10px);margin-top:clamp(10px,3vh,28px)}
.ov button{padding:clamp(6px,1.5vh,13px) 22px}
.ov button b{font-size:clamp(14px,2.4vh,18px)}
.panel{max-height:96vh;max-height:96dvh;gap:clamp(8px,2vh,18px);padding:clamp(16px,3vh,32px) 34px}
@media(max-height:760px){.ov button em,.sub{display:none}}
@media(max-height:560px){.kick{display:none}.keys{display:none}.shell{grid-template-columns:1fr 1fr}}

/* ===== bigger cards ===== */
.brand h1{font-size:clamp(44px,min(10vw,15vh),120px)}
.nav{width:min(540px,100%);gap:clamp(5px,1.3vh,12px)}
.ov button{padding:clamp(9px,2.2vh,20px) 30px}
.ov button b{font-size:clamp(15px,2.9vh,25px)}
.ov button em{font-size:clamp(12px,1.7vh,15px)}
.keys{font-size:clamp(14px,2vh,17px);padding:clamp(16px,3vh,30px) 32px;gap:clamp(8px,1.6vh,14px) 18px}
.keys kbd{font-size:clamp(12px,1.8vh,15px)}
.panel{width:min(680px,94vw);padding:clamp(18px,3.5vh,40px) clamp(20px,4vw,44px)}
.panel h2{font-size:clamp(26px,4.5vh,42px)}
.field{font-size:clamp(16px,2.6vh,22px)}
.ov .panel .seg button{min-width:clamp(40px,7vh,58px);padding:clamp(8px,1.7vh,14px) clamp(10px,1.6vw,18px);font-size:clamp(14px,2.3vh,20px)}
.ov .panel button{padding:clamp(10px,2vh,18px) 22px}
.ov .panel button b{font-size:clamp(15px,2.5vh,21px)}
input[type=range]{width:clamp(180px,30vw,280px)}
.sw{width:60px;height:32px;border-radius:16px}
.sw i{border-radius:16px}
.sw i::after{width:26px;height:26px}
.sw input:checked+i::after{transform:translateX(28px)}
.row{font-size:clamp(14px,2.3vh,19px);padding:clamp(6px,1.4vh,12px) 18px}
#rs{font-size:clamp(15px,2.4vh,20px)}

/* ===== TIME MODE ===== */
#chal{align-items:center;justify-content:center}
#chal.bye{animation:fo .45s ease-in forwards}
@keyframes fo{to{opacity:0;transform:scale(1.05)}}
.chw{position:relative;z-index:2;display:grid;grid-template-columns:auto minmax(0,580px);gap:clamp(16px,4vw,56px);align-items:center;width:min(1100px,92vw);margin:auto;padding-bottom:9vh}
#chr{height:min(62vh,470px);width:auto;filter:drop-shadow(0 0 28px #21e6ff55)}
#chal.run #chr{animation:cin .7s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes cin{from{opacity:0;transform:translateX(-60px)}}
#chr .halo{transform-origin:130px 170px;animation:k_hl 3.6s ease-in-out infinite}
@keyframes k_hl{50%{transform:scale(1.08);opacity:.7}}
#chr .shd{transform-origin:130px 292px;animation:k_sd 3.2s ease-in-out infinite}
@keyframes k_sd{50%{transform:scaleX(.93);opacity:.3}}
#chr .body{transform-origin:130px 296px;animation:k_br 3.2s ease-in-out infinite}
@keyframes k_br{50%{transform:scaleY(1.014) translateY(-1px)}}
#chal.talk #chr .body{animation:k_sw 1s ease-in-out infinite alternate}
@keyframes k_sw{from{transform:rotate(-1.1deg)}to{transform:rotate(1.1deg) translateY(-2px)}}
#chr .head{transform-origin:130px 172px;animation:k_hi 4s ease-in-out infinite}
@keyframes k_hi{0%,100%{transform:rotate(-1deg)}50%{transform:rotate(1.4deg) translateY(-1px)}}
#chal.talk #chr .head{animation:k_nd .62s ease-in-out infinite alternate}
@keyframes k_nd{from{transform:rotate(-2.4deg)}to{transform:rotate(2.6deg) translateY(-3px)}}
#chal.done #chr .head{animation:k_pr 1.2s ease-in-out infinite alternate}
@keyframes k_pr{from{transform:rotate(-1.5deg)}to{transform:rotate(2.2deg) translateY(-1px)}}
#chr .pony{transform-origin:170px 78px;animation:k_pn 2.8s ease-in-out infinite alternate}
@keyframes k_pn{from{transform:rotate(-4deg)}to{transform:rotate(7deg)}}
#chal.talk #chr .pony{animation-duration:.7s}
#chr .brows{animation:k_bw 5s ease-in-out infinite}
@keyframes k_bw{0%,88%,100%{transform:translateY(0)}92%{transform:translateY(-3px)}}
#chal.talk #chr .brows{animation:k_bt .9s ease-in-out infinite}
@keyframes k_bt{0%,100%{transform:translateY(0)}30%{transform:translateY(-4px)}60%{transform:translateY(-1px)}80%{transform:translateY(-3px)}}
#chr .pup{animation:k_lk 6s ease-in-out infinite}
@keyframes k_lk{0%,100%{transform:translate(0,0)}25%{transform:translate(-2.5px,0)}55%{transform:translate(2.5px,-1px)}80%{transform:translate(0,1px)}}
#chal.talk #chr .pup{animation:k_lt 2.4s ease-in-out infinite}
@keyframes k_lt{0%,100%{transform:translate(0,0)}30%{transform:translate(2px,-1px)}60%{transform:translate(-2px,0)}}
#chr .eyes{transform-box:fill-box;transform-origin:center;animation:k_blk 4.2s infinite}
@keyframes k_blk{0%,90%,100%{transform:scaleY(1)}92%{transform:scaleY(.08)}94%{transform:scaleY(1)}96%{transform:scaleY(.08)}98%{transform:scaleY(1)}}
#chr .chk{animation:k_ck 2.6s ease-in-out infinite}
@keyframes k_ck{50%{opacity:.75}}
#chr .mouthg{transform-box:fill-box;transform-origin:50% 25%;transform:scaleY(.1);opacity:0}
#chr .smile{transition:opacity .12s}
#chal.talk #chr .smile{opacity:0}
#chal.talk #chr .mouthg{opacity:1;animation:k_mth .46s ease-in-out infinite}
@keyframes k_mth{0%{transform:scale(.85,.2)}20%{transform:scale(1,1.05)}38%{transform:scale(.9,.4)}58%{transform:scale(1.1,.95)}75%{transform:scale(.85,.3)}100%{transform:scale(1,.8)}}
#chr .armL{transform-origin:72px 210px;animation:k_al 3.6s ease-in-out infinite alternate}
@keyframes k_al{from{transform:rotate(1.5deg)}to{transform:rotate(-2deg)}}
#chal.talk #chr .armL{animation:k_gl .85s ease-in-out infinite alternate}
@keyframes k_gl{from{transform:rotate(-5deg)}to{transform:rotate(8deg)}}
#chr .armR{transform-origin:194px 212px;animation:k_ar 3s ease-in-out infinite alternate}
@keyframes k_ar{from{transform:rotate(-2deg)}to{transform:rotate(3deg)}}
#chal.talk #chr .armR{animation:k_gr .7s ease-in-out .1s infinite alternate}
@keyframes k_gr{from{transform:rotate(-9deg)}to{transform:rotate(7deg)}}
#chal.done #chr .armR{animation:k_ch .45s ease-in-out infinite alternate}
@keyframes k_ch{from{transform:rotate(-3deg)}to{transform:rotate(-14deg) translateY(-3px)}}
#chr .swh{transform-origin:234px 112px;animation:k_tk 4s linear infinite}
@keyframes k_tk{to{transform:rotate(360deg)}}
#chal.talk #chr .swh{animation-duration:1.6s}
#chal.done #chr .swh{animation-duration:.9s}
#chr .stopw{transform-origin:234px 112px}
#chal.done #chr .stopw{animation:k_pu .8s ease-in-out infinite alternate}
@keyframes k_pu{from{transform:scale(1)}to{transform:scale(1.12) rotate(-6deg)}}
#chr .spk{transform-box:fill-box;transform-origin:center;animation:k_tw 2.4s ease-in-out infinite}
#chr .spk.b{animation-delay:-.7s}#chr .spk.c{animation-delay:-1.4s}#chr .spk.d{animation-delay:-2s}
@keyframes k_tw{0%,100%{transform:scale(.2) rotate(0);opacity:0}50%{transform:scale(1) rotate(90deg);opacity:1}}
#chr .fl{animation:k_fl 4s ease-in infinite}
#chr .fl.b{animation-delay:-1.3s}#chr .fl.c{animation-delay:-2.6s}
@keyframes k_fl{0%{transform:translateY(20px);opacity:0}25%{opacity:.9}100%{transform:translateY(-70px);opacity:0}}
#chal h1{font-size:clamp(40px,8vh,84px);font-style:italic;letter-spacing:.06em;line-height:1;background:linear-gradient(90deg,#ff2e88,#ffb020);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px #ff2e8877);transform:skewX(-8deg)}
#chal.run h1{animation:tin .6s .15s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes tin{from{opacity:0;transform:translateX(40px) skewX(-8deg)}}
.bub{position:relative;margin-top:clamp(10px,2.4vh,22px);padding:clamp(16px,3vh,28px) clamp(18px,3vw,32px);background:#0b0820e8;border:1px solid #21e6ff55;box-shadow:0 0 0 1px #ff2e8833,0 20px 60px #0009;font-size:clamp(18px,3.4vh,30px);font-weight:600;line-height:1.35}
.bub::before{content:'';position:absolute;left:-11px;top:34px;border:10px solid transparent;border-left:0;border-right-color:#21e6ff55}
#chal.run .bub{animation:tin .5s .35s both}
.g{visibility:hidden}
.cr{display:inline-block;width:.5em;height:1em;vertical-align:-.12em;margin-left:2px;background:#21e6ff;animation:cb .6s steps(1) infinite}
@keyframes cb{50%{opacity:0}}
.chips{display:flex;gap:14px;margin-top:clamp(12px,2.6vh,24px)}
.chip{flex:1;display:flex;align-items:baseline;gap:10px;padding:clamp(8px,1.6vh,14px) 18px;background:#ffffff10;border-left:4px solid #21e6ff;transform:skewX(-10deg)}
.chip>*{transform:skewX(10deg)}
.chip b{font-size:clamp(28px,6vh,54px);line-height:1;color:#21e6ff;font-style:italic}
.chip:nth-child(2){border-left-color:#ff2e88}.chip:nth-child(2) b{color:#ffb020}
.chip span{font-size:clamp(12px,2vh,17px);letter-spacing:.2em;font-weight:700;opacity:.8}
#chal:not(.done) .chip{opacity:0}
#chal.done .chip{animation:cp .5s cubic-bezier(.2,.9,.3,1.2) both}
#chal.done .chip:nth-child(2){animation-delay:.15s}
@keyframes cp{from{opacity:0;transform:skewX(-10deg) translateY(16px)}}
.cont{position:fixed;left:0;right:0;bottom:clamp(18px,6vh,56px);z-index:3;text-align:center;font-weight:700;letter-spacing:.18em;font-size:clamp(14px,2.4vh,20px);cursor:pointer;animation:pl 1.4s ease-in-out infinite}
.cont kbd{font-family:inherit;font-weight:700;padding:4px 12px;margin:0 4px;background:#ffffff18;border-bottom:3px solid #ff2e88;border-radius:5px}
@keyframes pl{50%{opacity:.35;transform:scale(.97)}}
#tm.tmode{font-size:34px!important;letter-spacing:.06em}
#tm.warn{color:#ff3b5c;text-shadow:0 0 16px #ff3b5c;animation:wp .5s ease-in-out infinite alternate}
@keyframes wp{to{transform:translateX(-50%) scale(1.12)}}
#res.pop .panel{animation:rp .5s cubic-bezier(.2,.9,.3,1.2)}
@keyframes rp{from{opacity:0;transform:scale(.85) translateY(20px)}}
#rt.tm{font-size:clamp(34px,7vh,60px)}
#rt.bad{background-image:linear-gradient(90deg,#ff2e4d,#ff7a3d)}
@media(max-width:760px){.chw{grid-template-columns:1fr;justify-items:center;text-align:center;padding-bottom:12vh}#chr{height:26vh}.bub::before{left:50%;top:-11px;margin-left:-10px;border:10px solid transparent;border-top:0;border-bottom-color:#21e6ff55}.chips{justify-content:center}}

 <div class="b" style="left:50%;bottom:16px;transform:translateX(-50%);width:320px">NITRO<div class="bar"><i id="nit" class="n"></i></div></div>

</div>

   <nav class="nav">
    <button id="resume" data-a="resume" style="display:none"><b>Resume</b><em>Back to your race</em></button>
